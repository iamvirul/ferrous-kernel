[package]
name = "ferrous-boot"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "UEFI bootloader for Ferrous Kernel"

[[bin]]
name = "ferrous-boot"
path = "src/main.rs"

[dependencies]
uefi = { version = "0.39", features = ["alloc"] }
log = { version = "0.4", default-features = false }
ferrous-boot-info = { path = "../lib/boot-info" }
ferrous-core = { path = "../lib/core" }
ferrous-kernel = { path = "../kernel" }
linked_list_allocator = "0.10"

# Boot code requires unsafe for UEFI interface, so we don't inherit workspace lints
[lints.rust]
unsafe_code = "warn"
warnings = "warn"

[lints.clippy]
warnings = "warn"
