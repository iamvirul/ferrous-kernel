name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  boot-verify:
    name: Boot Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2
        with:
          toolchain: nightly
          targets: x86_64-unknown-uefi
          components: rust-src

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf

      - name: Run boot verification
        run: ./scripts/verify-boot.sh --release --timeout 60

  build-image:
    name: Build Disk Image
    runs-on: ubuntu-latest
    needs: boot-verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2
        with:
          toolchain: nightly
          targets: x86_64-unknown-uefi
          components: rust-src

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y mtools dosfstools

      - name: Build bootable disk image
        run: ./scripts/make-image.sh --release

      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrous-boot-img
          path: ferrous-boot.img
          retention-days: 7

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download disk image
        uses: actions/download-artifact@v4
        with:
          name: ferrous-boot-img

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NUM="${VERSION#v}"
          # Extract the section for this version: from '## [X.Y.Z]' up to (not including) the next '## '
          NOTES=$(awk "/^## \[${VERSION_NUM}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi
          # Write to a file to avoid quoting issues with multiline strings
          printf '%s' "$NOTES" > release-notes.txt
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          gh release create "$VERSION" \
            --title "Ferrous Kernel ${VERSION}" \
            --notes-file release-notes.txt \
            ferrous-boot.img
